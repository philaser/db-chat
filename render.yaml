services:
  - type: web
    name: db-chat
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node dist-web-server/server/server.js
    healthCheckPath: /api/v1/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DBCHAT_STORAGE_MODE
        value: supabase
      - key: DBCHAT_WEB_AUTH_MODE
        value: app
      - key: DBCHAT_WEB_HOST
        value: 0.0.0.0
      - key: DBCHAT_WEB_MAX_CONCURRENT_REQUESTS
        value: '4'
      - key: DBCHAT_WEB_MAX_ACTIVE_TURNS
        value: '2'
      - key: DBCHAT_WEB_MAX_DATABASE_OPERATIONS
        value: '1'
      - key: DBCHAT_WEB_MAX_CONCURRENT_UPLOADS
        value: '1'
      - key: DBCHAT_WEB_ALLOWED_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DBCHAT_WEB_SECRET_KEY
        sync: false
      - key: DBCHAT_WEB_OPENROUTER_API_KEY
        sync: false
