services:
  dbchat:
    build: .
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      DBCHAT_STORAGE_MODE: supabase
      DBCHAT_WEB_AUTH_MODE: app
      DBCHAT_WEB_ALLOWED_ORIGIN: ${DBCHAT_WEB_ALLOWED_ORIGIN:?Set the public HTTPS application origin}
      SUPABASE_URL: ${SUPABASE_URL:?Set the Supabase project URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set the Supabase publishable key}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set the server-only service role key}
      DBCHAT_WEB_SECRET_KEY: ${DBCHAT_WEB_SECRET_KEY:?Set a stable random encryption key}
      DBCHAT_WEB_OPENROUTER_API_KEY: ${DBCHAT_WEB_OPENROUTER_API_KEY:?Set the server-managed model key}
      DBCHAT_WEB_MODEL: ${DBCHAT_WEB_MODEL:-google/gemini-2.5-flash}
      DBCHAT_WEB_ALLOWED_DATABASE_HOSTS: ${DBCHAT_WEB_ALLOWED_DATABASE_HOSTS:-}
      DBCHAT_WEB_MAX_CONCURRENT_REQUESTS: ${DBCHAT_WEB_MAX_CONCURRENT_REQUESTS:-8}
      DBCHAT_WEB_MAX_ACTIVE_TURNS: ${DBCHAT_WEB_MAX_ACTIVE_TURNS:-2}
      DBCHAT_WEB_MAX_DATABASE_OPERATIONS: ${DBCHAT_WEB_MAX_DATABASE_OPERATIONS:-1}
      DBCHAT_WEB_MAX_CONCURRENT_UPLOADS: ${DBCHAT_WEB_MAX_CONCURRENT_UPLOADS:-1}
    mem_limit: 1g
    cpus: 1
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
