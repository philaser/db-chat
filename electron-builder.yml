appId: com.philaser.dbchat
productName: DB Chat
directories:
  app: dist-desktop
  output: release
  buildResources: build
npmRebuild: false
asar: true
afterPack: scripts/verify-desktop-package.cjs
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
files:
  - "*.js"
  - application.json
  - package.json
  - "!node_modules/**/*"
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  category: Development
  maintainer: DB Chat contributors
  synopsis: Desktop access to the hosted DB Chat workspace.
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
publish:
  provider: github
  owner: philaser
  repo: db-chat
  releaseType: release
